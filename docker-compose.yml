services:
  demo-client:
    build:
      context: .
    ports:
      - "8081:8081"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.6.0
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - demo-client
    networks:
      - monitoring

networks:
  monitoring:
